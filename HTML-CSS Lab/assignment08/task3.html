<!DOCTYPE html>
<html>
<head>
    <title>Required Signup Form</title>
</head>
<body>
    <h1>Registration Form</h1>

    <form>
        <label for="name">Full Name:</label>
        <input type="text"
               id="name"
               name="fullname"
               placeholder="Enter your name"
               required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email"
               id="email"
               name="email"
               required>
        <br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
