<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .box {
            background-color: lightblue;
            padding: 30px;
            text-align: center;
            border: 1px solid navy;
        }
    </style>
</head>
<body>
    <h1>CSS Grid Example</h1>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
</body>
</html>
