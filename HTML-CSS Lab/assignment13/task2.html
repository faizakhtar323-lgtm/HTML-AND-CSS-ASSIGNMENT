<!DOCTYPE html>
<html>
<head>
    <title>Centred Cards</title>

    <style>
        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 300px;
        }

        .card {
            padding: 25px;
            background-color: lightblue;
            border: 1px solid navy;
            text-align: center;
            width: 120px;
        }
    </style>
</head>
<body>
    <h1>Pricing Plans</h1>

    <div class="row">
        <div class="card">
            <h3>Starter</h3>
            <p>199</p>
        </div>

        <div class="card">
            <h3>Standard</h3>
            <p>349</p>
        </div>

        <div class="card">
            <h3>Premium</h3>
            <p>499</p>
        </div>
    </div>
</body>
</html>
