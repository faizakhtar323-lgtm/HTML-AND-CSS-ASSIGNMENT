<!DOCTYPE html>
<html>
<head>
    <title>Inline and Internal CSS</title>

    <style>
        h1 {
            color: navy;
        }

        .highlight {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>CSS Fundamentals</h1>

    <p style="color: red;">
        This paragraph uses inline CSS.
    </p>

    <p class="highlight">
        This paragraph uses internal CSS.
    </p>
</body>
</html>
