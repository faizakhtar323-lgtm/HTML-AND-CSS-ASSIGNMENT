<!DOCTYPE html>
<html>
<head>
    <title>Scrolling Box</title>

    <style>
        .box {
            height: 120px;
            width: 300px;
            overflow: auto;
            border: 2px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Scrollable Box</h1>

    <div class="box">
        <p>Line 1</p>
        <p>Line 2</p>
        <p>Line 3</p>
        <p>Line 4</p>
        <p>Line 5</p>
    </div>
</body>
</html>
